openapi: 3.0.3
info:
  title: 'Laravel API Documentation'
  description: ''
  version: 1.0.0
servers:
  -
    url: 'http://localhost:8000'
tags:
  -
    name: Endpoints
    description: ''
  -
    name: 'Resident Management'
    description: "\nAPIs for managing the barangay resident database."
components:
  securitySchemes:
    default:
      type: http
      scheme: bearer
      description: 'You can retrieve your API token from the Barangay Administrator.'
security:
  -
    default: []
paths:
  /api/webhooks/stripe:
    post:
      summary: ''
      operationId: postApiWebhooksStripe
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Endpoints
  /api/user:
    get:
      summary: ''
      operationId: getApiUser
      description: ''
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  id: 019dc503-8ba8-7386-96e4-55db5a62fee5
                  name: 'Juan Dela Cruz'
                  email: deguzman.ralphethan@student.auf.edu.ph
                  email_verified_at: null
                  created_at: '2026-04-25T14:20:37.000000Z'
                  updated_at: '2026-04-25T14:20:37.000000Z'
