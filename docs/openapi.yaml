                  id:
                    type: string
                    example: 019dc503-8ba8-7386-96e4-55db5a62fee5
                  name:
                    type: string
                    example: 'Juan Dela Cruz'
                  email:
                    type: string
                    example: deguzman.ralphethan@student.auf.edu.ph
                  email_verified_at:
                    type: string
                    example: null
                    nullable: true
                  created_at:
                    type: string
                    example: '2026-04-25T14:20:37.000000Z'
                  updated_at:
                    type: string
                    example: '2026-04-25T14:20:37.000000Z'
      tags:
        - Endpoints
  /api/weather:
    get:
      summary: 'Fetch live weather data for Angeles City from an External API'
      operationId: fetchLiveWeatherDataForAngelesCityFromAnExternalAPI
      description: ''
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Weather data fetched successfully from Open-Meteo.'
                  location: 'Angeles City, Pampanga'
                  temperature: 29.8°C
                  windspeed: '7.8 km/h'
                  is_day: 'Yes'
                  raw_data:
                    time: '2026-04-28T08:45'
                    interval: 900
                    temperature: 29.8
                    windspeed: 7.8
                    winddirection: 105
                    is_day: 1
                    weathercode: 1
                properties:
                  message:
                    type: string
                    example: 'Weather data fetched successfully from Open-Meteo.'
                  location:
                    type: string
                    example: 'Angeles City, Pampanga'
                  temperature:
                    type: string
                    example: 29.8°C
                  windspeed:
                    type: string
                    example: '7.8 km/h'
                  is_day:
                    type: string
                    example: 'Yes'
                  raw_data:
                    type: object
                    properties:
                      time:
                        type: string
                        example: '2026-04-28T08:45'
                      interval:
                        type: integer
                        example: 900
                      temperature:
                        type: number
                        example: 29.8
                      windspeed:
                        type: number
                        example: 7.8
                      winddirection:
                        type: integer
                        example: 105
                      is_day:
                        type: integer
                        example: 1
                      weathercode:
                        type: integer
                        example: 1
      tags:
        - Endpoints
  /api/residents:
    get:
      summary: 'List all residents'
      operationId: listAllResidents
      description: "Returns a paginated list of all residents in the barangay.\n* @authenticated"
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  status: success
                  message: 'Residents retrieved successfully.'
                  data:
                    current_page: 1
                    data:
                      -
                        id: 019dc54c-aa04-704a-bcd2-49b05b982a07
                        first_name: test
                        middle_name: t
                        last_name: test1
                        suffix: null
                        date_of_birth: '2019-01-29'
                        gender: Male
                        civil_status: Single
