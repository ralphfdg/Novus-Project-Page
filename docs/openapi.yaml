                    first_page_url: 'http://localhost:8000/api/residents?page=1'
                    from: 1
                    last_page: 1
                    last_page_url: 'http://localhost:8000/api/residents?page=1'
                    links:
                      -
                        url: null
                        label: '&laquo; Previous'
                        page: null
                        active: false
                      -
                        url: 'http://localhost:8000/api/residents?page=1'
                        label: '1'
                        page: 1
