      tags:
        - 'Resident Management'
    post:
      summary: 'Register a new resident'
      operationId: registerANewResident
      description: 'Creates a new resident record in the database.'
      parameters: []
      responses: {  }
      tags:
        - 'Resident Management'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                first_name:
                  type: string
                  description: 'The first name of the resident.'
                  example: Juan
                middle_name:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: amniihfqcoynlazghdtqt
                  nullable: true
                last_name:
                  type: string
                  description: 'The last name.'
                  example: 'Dela Cruz'
                suffix:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: auydlsmsjuryvojcybzvr
                  nullable: true
                date_of_birth:
                  type: date
                  description: 'Format: YYYY-MM-DD.'
                  example: '1990-05-15'
                gender:
                  type: string
                  description: 'Must be Male, Female, or Other.'
                  example: Male
                civil_status:
                  type: string
                  description: 'Single, Married, Widowed, or Legally Separated.'
                  example: Single
                purok_or_street:
                  type: string
                  description: 'Street address.'
                  example: 'Purok 1'
                contact_number:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: vazjrcnfbaqywuxhgjjmz
                  nullable: true
                is_registered_voter:
                  type: boolean
                  description: ''
                  example: true
                  nullable: true
                occupation:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: uxjubqouzswiwxtrkimfc
                  nullable: true
                residency_status:
                  type: string
                  description: ''
                  example: Moved
                  enum:
                    - Active
                    - Moved
                    - Deceased
                  nullable: true
              required:
                - first_name
                - last_name
                - date_of_birth
                - gender
                - civil_status
                - purok_or_street
  '/api/residents/{id}':
    get:
      summary: 'Get a specific resident'
      operationId: getASpecificResident
      description: "Retrieves the complete profile of a single resident using their UUID.\n* @authenticated"
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  status: success
                  message: 'Resident details retrieved.'
                  data:
                    id: 019dc54c-aa04-704a-bcd2-49b05b982a07
                    first_name: test
                    middle_name: t
                    last_name: test1
                    suffix: null
                    date_of_birth: '2019-01-29'
                    gender: Male
                    civil_status: Single
                    purok_or_street: 'FPH 11'
                    contact_number: '09288736929'
                    is_registered_voter: 0
                    occupation: Worker
                    residency_status: Active
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: 'Resident details retrieved.'
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        example: 019dc54c-aa04-704a-bcd2-49b05b982a07
                      first_name:
                        type: string
                        example: test
                      middle_name:
                        type: string
                        example: t
                      last_name:
                        type: string
                        example: test1
                      suffix:
                        type: string
                        example: null
                        nullable: true
                      date_of_birth:
                        type: string
                        example: '2019-01-29'
                      gender:
                        type: string
                        example: Male
                      civil_status:
                        type: string
                        example: Single
                      purok_or_street:
                        type: string
                        example: 'FPH 11'
                      contact_number:
                        type: string
                        example: '09288736929'
                      is_registered_voter:
                        type: integer
                        example: 0
                      occupation:
                        type: string
                        example: Worker
                      residency_status:
                        type: string
                        example: Active
      tags:
        - 'Resident Management'
    patch:
      summary: 'Update a resident'
      operationId: updateAResident
      description: "Partially update an existing resident's information. You only need to send the fields you wish to change."
      parameters: []
      responses: {  }
      tags:
        - 'Resident Management'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                first_name:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: vmqeopfuudtdsufvyvddq
                middle_name:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: amniihfqcoynlazghdtqt
                  nullable: true
                last_name:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: qxbajwbpilpmufinllwlo
                suffix:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: auydlsmsjuryvojcybzvr
                  nullable: true
                date_of_birth:
                  type: string
                  description: 'Must be a valid date.'
                  example: '2026-04-28T00:45:29'
                gender:
                  type: string
                  description: ''
                  example: Female
                  enum:
                    - Male
                    - Female
                    - Other
                civil_status:
                  type: string
                  description: ''
                  example: Widowed
                  enum:
                    - Single
                    - Married
                    - Widowed
                    - 'Legally Separated'
                purok_or_street:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: byickznkygloigmkwxphl
                contact_number:
                  type: string
                  description: 'The new contact number.'
                  example: '09123456789'
                  nullable: true
                is_registered_voter:
                  type: boolean
                  description: ''
                  example: true
                occupation:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: uxjubqouzswiwxtrkimfc
                  nullable: true
                residency_status:
                  type: string
                  description: ''
                  example: Active
                  enum:
                    - Active
                    - Moved
                    - Deceased
    delete:
      summary: 'Delete a resident'
      operationId: deleteAResident
      description: 'Permanently removes a resident from the database.'
      parameters: []
      responses: {  }
      tags:
        - 'Resident Management'
    parameters:
      -
        in: path
        name: id
        description: 'The UUID of the resident.'
        example: 019dc54c-aa04-704a-bcd2-49b05b982a07
        required: true
        schema:
          type: string
