                            purok_or_street: 'FPH 1 brgy24'
                            contact_number: '09288736929'
                            is_registered_voter: 0
                            occupation: null
                            residency_status: Active
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              example: 019dc54c-aa04-704a-bcd2-49b05b982a07
                            first_name:
                              type: string
                              example: test
                            middle_name:
                              type: string
                              example: t
                            last_name:
                              type: string
                              example: test1
                            suffix:
