                            gender: Male
                            civil_status: Single
                            purok_or_street: 'FPH 11'
                            contact_number: '09288736929'
                            is_registered_voter: 0
                            occupation: Worker
                            residency_status: Active
                          -
                            id: 019dc6ab-5cc6-7019-b124-e0ae3c50b7a9
                            first_name: Maria
                            middle_name: null
